name: Release & Upload to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e .

      - name: Install Hatch
        run: python -m pip install --upgrade hatch

      - name: Verify tag matches pyproject version and CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')"
          echo "Tag version:     $TAG"
          echo "Project version: $VER"
          test "$TAG" = "$VER" || { echo "ERROR: tag $TAG != pyproject version $VER"; exit 1; }
          grep -q "^## \[$VER\]" CHANGELOG.md || { echo "ERROR: no CHANGELOG entry for $VER"; exit 1; }

      - name: Clean previous builds
        run: rm -rf dist/

      - name: Build the package with Hatch
        run: hatch build

      - name: Extract release notes from CHANGELOG.md
        run: |
          echo 'RELEASE_BODY<<EOF' >> $GITHUB_ENV
          awk '
            BEGIN {found=0; capture=0}
            /^## \[Unreleased\]/ {next}
            /^## \[/ {
              if (found) exit;
              found = 1;
              capture = 1;
              next
            }
            /^## / {capture=0}
            capture {print}
          ' CHANGELOG.md >> $GITHUB_ENV
          echo 'EOF' >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ env.RELEASE_BODY }}
          files: |
            dist/*.tar.gz
            dist/*.whl

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Trigger ReadTheDocs build
        env:
          RTD_SECRET: ${{ secrets.RTD_SECRET }}
          RTD_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${RTD_SECRET:-}" ]; then
            echo "::error::RTD_SECRET is not set; cannot trigger a ReadTheDocs build."
            exit 1
          fi
          # curl exits 0 on a 4xx unless told otherwise.  These calls used to
          # go unchecked, so an expired token would print a 401 body and the
          # step would still pass -- the docs would just stop updating.
          trigger() {
            local version="$1"
            local code
            code=$(curl -sS --max-time 60 -o rtd-response.json -w '%{http_code}' \
              -X POST \
              -H "Authorization: Token ${RTD_SECRET}" \
              "https://readthedocs.org/api/v3/projects/htpolynet/versions/${version}/builds/")
            echo "ReadTheDocs (${version}) returned HTTP ${code}"
            cat rtd-response.json || true
            echo
            case "${code}" in
              2*) return 0 ;;
              *)  echo "::error::RTD returned HTTP ${code} for version '${version}'."; return 1 ;;
            esac
          }
          trigger latest
          # The tag's own version may not exist yet if RTD has not synced it;
          # that is not a release failure, so report it without failing the job.
          trigger "${RTD_VERSION}" || echo "::warning::Could not trigger the '${RTD_VERSION}' version build; trigger it from the RTD dashboard if that version is expected."

  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1